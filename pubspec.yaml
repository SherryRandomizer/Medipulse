name: medipulse
description: MediPulse — never miss your medicine. Production medication reminders for Android and iOS.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  intl: ^0.20.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  flutter_local_notifications: ^19.4.0
  uuid: ^4.5.1
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  clock: ^1.1.2
  collection: ^1.19.1
  permission_handler: ^12.0.1
  table_calendar: ^3.2.0
  fl_chart: ^1.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.6
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
